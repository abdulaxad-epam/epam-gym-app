plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

group = 'epam'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    openApiVersion = "2.3.0"
    mapstructVersion = "1.6.0.Beta1"
    mapstructBindingVersion = "0.2.0"
    lombokVersion = "1.18.36"
    instancioVersion = "5.0.2"
    suitVersion = "1.10.0"
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // AspectJ
    implementation 'org.aspectj:aspectjweaver:1.9.19'

    testImplementation "org.junit.platform:junit-platform-suite-api:${suitVersion}"
    testImplementation group: 'org.instancio', name: 'instancio-junit', version: instancioVersion


    // Database
    implementation 'com.h2database:h2'
    implementation 'org.postgresql:postgresql'

    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'

    // OpenAPI Documentation
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${mapstructBindingVersion}"

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    testImplementation 'junit:junit'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.instancio:instancio-junit'
}

tasks.named('test') {
    useJUnitPlatform()
}
