plugins {
    id 'java'
    id 'jacoco'
}

group = 'epam'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.springframework', name: 'spring-context', version: '6.2.2'
    testImplementation group: 'org.springframework', name: 'spring-test', version: '6.2.2'
    implementation group: 'org.springframework', name: 'spring-web', version: '6.2.2'
    implementation group: 'org.springframework', name: 'spring-core', version: '6.2.2'
    implementation group: 'org.springframework', name: 'spring-webmvc', version: '6.2.2'


    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.3.0'

    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: '11.0.5'
    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-jasper', version: '11.0.5'
    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-websocket', version: '11.0.5'
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.0.0'


    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.11.4'
    testImplementation group: 'org.junit.platform', name: 'junit-platform-suite', version: '1.10.0'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.26.3'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.14.2'
    testImplementation group: 'org.mockito', name: 'mockito-junit-jupiter', version: '5.11.0'
    testImplementation group: 'junit', name: 'junit', version: '3.8.1'

    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
    implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '2.1.1'

    implementation group: 'org.mapstruct', name: 'mapstruct', version: '1.6.0.Beta1'
    annotationProcessor group: 'org.mapstruct', name: 'mapstruct-processor', version: '1.6.0.Beta1'
    annotationProcessor group: 'org.projectlombok', name: 'lombok-mapstruct-binding', version: '0.2.0'

    implementation group: 'com.h2database', name: 'h2', version: '2.2.224'
    implementation group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.6.4.Final'
    implementation group: 'org.springframework', name: 'spring-orm', version: '6.2.2'

    testImplementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.17.1'
}

tasks.named('test') {
    useJUnitPlatform()
}