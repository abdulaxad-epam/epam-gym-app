spring:
  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:postgresql://postgres:5434/epam
    driver-class-name: org.postgresql.Driver
    username: epam
    password: root

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
      jakarta.persistence.sql-load-script-source: classpath:database_initializer/data.sql
    open-in-view: true

  data:

    jpa:
      repositories:
        enabled: true
server:
  port: 8080

application:
  security:
    jwt-token:
      access-expiration: 15778800000  #  6 months
      refresh-expiration: 15778800000  #  6 months
      keys:
        secret-key: "wkm95QJ7hYC9RiwrV7mesbY4PAahERJawntho0my942XheVLmGwLMBkQ"